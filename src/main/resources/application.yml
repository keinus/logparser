spring:
  application:
    name: logparser
  profiles:
    active:
      - ops
  datasource:
    url: jdbc:sqlite:${user.home}/logparser/data/config.db
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 443

logparser:
  config-source: DATABASE
  migration:
    enabled: true
    auto-import-yaml: false
    yaml-file-path: ./config/config.yaml
